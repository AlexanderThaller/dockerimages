# The chaos run itself, as a Job, to sit beside a storage-bench run in the same
# cluster. `just deploy openshift-storage` fills the placeholders in and
# applies it; deploy/rbac.yaml has to have been applied for every namespace
# listed in __NAMESPACES__ first, or the run stops at its preflight check
# rather than halfway through.
#
# The report goes into an emptyDir, which is deleted with the pod — so HOLD
# keeps the container alive for an hour after the run finishes, which is what
# makes it copyable:
#
#   oc -n storage-chaos logs -f job/storage-chaos
#   oc -n storage-chaos cp $(oc -n storage-chaos get pod -l job-name=storage-chaos \
#       -o name | head -1 | cut -d/ -f2):/out ./chaos-results
#
# A PVC instead of the emptyDir would outlive the pod and remove the need for
# the hold — but it would also mean this run's report lands on the storage the
# run is disrupting, which is a way to lose exactly the report that mattered.
#
# backoffLimit is 0 on purpose. A chaos run that died halfway has already
# perturbed the cluster and its timeline no longer lines up with the
# benchmark's; a fresh attempt would kill more pods and write a second report
# that overlaps the first. Read what it managed and start a new one
# deliberately.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-chaos
  namespace: __CHAOS_NAMESPACE__
  labels: { app: storage-chaos }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: storage-chaos }
    spec:
      serviceAccountName: storage-chaos
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage-chaos
          image: __IMAGE__
          args: [__NAMESPACES__]
          env:
            - { name: OUTBASE, value: "/out" }
            - { name: MODE, value: "__MODE__" }
            - { name: SEED, value: "__SEED__" }
            - { name: ITERATIONS, value: "__ITERATIONS__" }
            - { name: INTERVAL, value: "__INTERVAL__" }
            - { name: SELECTOR, value: "__SELECTOR__" }
            - { name: INCLUDE, value: "__INCLUDE__" }
            - { name: EXCLUDE, value: "__EXCLUDE__" }
            - { name: DRY_RUN, value: "__DRY_RUN__" }
            # An hour to copy the report out before the pod's filesystem goes.
            - { name: HOLD, value: "3600" }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: out, mountPath: /out }
      volumes:
        - name: out
          emptyDir: {}
